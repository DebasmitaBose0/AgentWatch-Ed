name: Coverage & Security Guard (ELUSoC_2026)

on:
  pull_request:
    branches: [ main ]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest pytest-asyncio pytest-cov bandit

    - name: Run Security Scan (Bandit)
      run: |
        bandit -r agentwatch/ -ll

    - name: Run Tests with Coverage
      run: |
        python -m pytest --cov=agentwatch tests/ --cov-fail-under=70
