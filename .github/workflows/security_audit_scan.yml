name: Security Audit Scanner (ELUSoC_2026)

on:
  pull_request:
    branches: [ main ]

jobs:
  bandit_audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install bandit

    - name: Execute Bandit Security Audit
      run: |
        python scripts/run_bandit_audit.py
